<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Level 1 - Gem T Abaddon</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Cinzel+Decorative:wght@400;700;900&display=swap" rel="stylesheet">

    <style>

        body {
            background-color: black;
            color: white;
            margin: 0;
            font-family: "Cinzel", serif;
            text-align: center;
        }

        .page {
            width: 100%;
            padding-top: 40px;
            padding-bottom: 80px;
        }

        .back-button {
            position: fixed;
            top: 25px;
            left: 30px;

            color: white;
            text-decoration: none;

            font-family: "Cinzel", serif;
            font-size: 16px;

            border: 1px solid white;
            padding: 10px 18px;

            transition: all 0.25s ease;
        }

        .back-button:hover {
            transform: scale(1.05);
        }

        h1 {
            font-family: "Cinzel Decorative", serif;
            font-size: 38px;
            margin-top: 20px;
            margin-bottom: 60px;
        }

        .content {
            width: 80%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .content img {
            display: block;
            width: 100%;
            height: auto;
            margin: 0 auto 60px auto;
        }

        @media (max-width: 700px) {

            .page {
                padding-top: 80px;
            }

            .back-button {
                top: 15px;
                left: 15px;
                font-size: 13px;
                padding: 8px 12px;
            }

            h1 {
                font-size: 28px;
                margin-bottom: 40px;
            }

            .content {
                width: 92%;
            }

            .content img {
                margin-bottom: 35px;
            }

        }

    </style>

</head>

<body>

    <div class="page">

        <a href="index.html" class="back-button">
            ← GO BACK TO MAIN
        </a>

        <h1>LEVEL 1</h1>

        <div class="content">

            <!-- YOUR IMAGES WILL GO HERE -->

        </div>

    </div>

</body>

</html>
