<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Level 1</title>

    <style>

        body {
            background-color: black;
            margin: 0;
            padding: 0;
        }

        .back-button {
            position: fixed;
            top: 25px;
            left: 30px;

            color: white;
            text-decoration: none;

            font-family: Arial, sans-serif;
            font-size: 16px;

            border: 1px solid white;
            padding: 10px 18px;

            z-index: 1000;

            transition: transform 0.25s ease;
        }

        .back-button:hover {
            transform: scale(1.05);
        }

        .content {
            width: 80%;
            max-width: 1000px;
            margin: 0 auto;
            padding-top: 100px;
            padding-bottom: 80px;
        }

        .content img {
            display: block;
            width: 100%;
            height: auto;
            margin: 0 auto 60px auto;
        }

        @media (max-width: 700px) {

            .back-button {
                top: 15px;
                left: 15px;
                font-size: 13px;
                padding: 8px 12px;
            }

            .content {
                width: 92%;
                padding-top: 80px;
            }

            .content img {
                margin-bottom: 35px;
            }

        }

    </style>

</head>

<body>

    <a href="index.html" class="back-button">
        ← GO BACK TO MAIN
    </a>

    <div class="content">

      <img src="lvl1-01.jpg" alt="">
<img src="lvl1-02.jpg" alt="">
<img src="lvl1-03.png" alt="">
<img src="lvl1-04.png" alt="">
<img src="lvl1-05.png" alt="">
<img src="lvl1-06.png" alt="">
<img src="lvl1-07.png" alt="">
<img src="lvl1-08.png" alt="">
<img src="lvl1-09.png" alt="">

    </div>

</body>

</html>
